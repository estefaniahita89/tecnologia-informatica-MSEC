name: Restore and fix guide

on:
  push:
    paths:
      - '.github/workflows/restore-and-fix-guide.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore previous guide and apply fixes
        shell: python
        run: |
          import subprocess
          from pathlib import Path

          path = Path('guia_profesorado_tecnologia_informatica.html')
          subprocess.run(['git', 'checkout', 'df778d6e40ea45de201faeb8c95dcb3b3042a042', '--', str(path)], check=True)
          html = path.read_text(encoding='utf-8')

          old = '''#page-recorrido .per-forum-guidance,\n#page-recorrido .per-activity-deadlines,\n#page-recorrido .per-exam-responsibilities{\n  margin:18px 0 22px;\n  padding:18px 20px;\n  border:1px solid #d9e7ee;\n  border-radius:15px;\n  background:#f8fbfd;\n}'''
          new = '''#page-recorrido .per-forum-guidance,\n#page-recorrido .per-activity-deadlines,\n#page-recorrido .per-exam-responsibilities{\n  margin:18px 0 22px 96px;\n  padding:18px 20px;\n  border:1px solid #d9e7ee;\n  border-radius:15px;\n  background:#f8fbfd;\n}\n@media(max-width:900px){\n  #page-recorrido .per-forum-guidance,\n  #page-recorrido .per-activity-deadlines,\n  #page-recorrido .per-exam-responsibilities{\n    margin-left:68px;\n  }\n}\n@media(max-width:560px){\n  #page-recorrido .per-forum-guidance,\n  #page-recorrido .per-activity-deadlines,\n  #page-recorrido .per-exam-responsibilities{\n    margin-left:0;\n  }\n}'''
          if old not in html:
              raise SystemExit('CSS block not found')
          html = html.replace(old, new, 1)

          marker = '<div class="per-callout">Cada grabación debe titularse manualmente desde el portal de Zoom antes de la sesión, para que el alumnado pueda localizarla correctamente.</div>'
          ppt = 'Clase%20presentaci%C3%B3n%20asignatura%20para%20adaptar%20a%20cada%20asignatura%20(1).pptx'
          button = marker + f'''\n<div class="per-actions per-session-materials">\n<a class="per-material-button" href="{ppt}" download="PowerPoint primera sesión.pptx">Descargar PowerPoint de la 1.ª sesión ↓</a>\n</div>'''
          if marker not in html:
              raise SystemExit('First-session marker not found')
          html = html.replace(marker, button, 1)

          style_marker = '.per-actions span{padding:8px 12px;border-radius:999px;background:#edf8fc;color:#17627d;font-size:13px;font-weight:700}'
          style_add = style_marker + '''\n.per-session-materials{margin-top:14px}\n.per-material-button{\n  display:inline-flex;\n  align-items:center;\n  padding:9px 14px;\n  border-radius:9px;\n  background:#078fbd;\n  color:#fff !important;\n  font-size:12px;\n  font-weight:800;\n  text-decoration:none !important;\n}\n.per-material-button:hover{opacity:.88}\n'''
          if style_marker not in html:
              raise SystemExit('Action style marker not found')
          html = html.replace(style_marker, style_add, 1)

          path.write_text(html, encoding='utf-8')

      - name: Commit fixes and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add guia_profesorado_tecnologia_informatica.html
          git rm .github/workflows/restore-and-fix-guide.yml
          git commit -m "Fix roadmap layout and link first-session PPT"
          git push
