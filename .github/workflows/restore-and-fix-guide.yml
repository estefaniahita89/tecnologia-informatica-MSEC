name: Restore guide
on:
  push:
    paths:
      - '.github/workflows/restore-and-fix-guide.yml'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore
        run: |
          git show HEAD~6:guia_profesorado_tecnologia_informatica.html > guia_profesorado_tecnologia_informatica.html
          test -s guia_profesorado_tecnologia_informatica.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add guia_profesorado_tecnologia_informatica.html
          git rm .github/workflows/restore-and-fix-guide.yml
          git commit -m "Restore guide"
          git push
