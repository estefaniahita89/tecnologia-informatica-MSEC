name: Restore final guide
on:
  push:
    paths:
      - '.github/workflows/restore-final.yml'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          git show 8ed16703a43dd13c5482419231461a345760b4e1^:guia_profesorado_tecnologia_informatica.html > guia_profesorado_tecnologia_informatica.html
          test -s guia_profesorado_tecnologia_informatica.html
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add guia_profesorado_tecnologia_informatica.html
          git rm .github/workflows/restore-final.yml
          git commit -m "Restore guide from parent commit"
          git push
