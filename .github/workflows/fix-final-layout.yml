name: Fix final layout
on:
  push:
    paths:
      - '.github/workflows/fix-final-layout.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject layout fix and PPT link
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('guia_profesorado_tecnologia_informatica.html')
          html=path.read_text(encoding='utf-8')
          css='''<style id="forum-guidance-layout-fix">\n#page-recorrido .per-forum-guidance,\n#page-recorrido .per-activity-deadlines,\n#page-recorrido .per-exam-responsibilities{margin-left:96px!important;}\n@media(max-width:900px){#page-recorrido .per-forum-guidance,#page-recorrido .per-activity-deadlines,#page-recorrido .per-exam-responsibilities{margin-left:68px!important;}}\n@media(max-width:560px){#page-recorrido .per-forum-guidance,#page-recorrido .per-activity-deadlines,#page-recorrido .per-exam-responsibilities{margin-left:0!important;}}\n</style>'''
          if 'id="forum-guidance-layout-fix"' not in html:
              if '</head>' not in html: raise SystemExit('head tag not found')
              html=html.replace('</head>',css+'\n</head>',1)
          js='''<script id="first-session-ppt-link">\n(function(){\n  function addPpt(){\n    var callouts=document.querySelectorAll('#page-recorrido .per-callout');\n    var target=null;\n    callouts.forEach(function(c){if(!target && c.textContent.indexOf('Cada grabación debe titularse manualmente')!==-1)target=c;});\n    if(!target || document.getElementById('first-session-ppt-download'))return;\n    var wrap=document.createElement('div');\n    wrap.className='per-actions per-session-materials';\n    var link=document.createElement('a');\n    link.id='first-session-ppt-download';\n    link.className='per-material-button';\n    link.href='Clase%20presentaci%C3%B3n%20asignatura%20para%20adaptar%20a%20cada%20asignatura%20(1).pptx';\n    link.setAttribute('download','PowerPoint primera sesión.pptx');\n    link.textContent='Descargar PowerPoint de la 1.ª sesión ↓';\n    wrap.appendChild(link);\n    target.insertAdjacentElement('afterend',wrap);\n  }\n  document.addEventListener('DOMContentLoaded',addPpt);\n  window.addEventListener('hashchange',addPpt);\n})();\n</script>'''
          if 'id="first-session-ppt-link"' not in html:
              if '</body>' not in html: raise SystemExit('body tag not found')
              html=html.replace('</body>',js+'\n</body>',1)
          button_css='''<style id="first-session-ppt-style">\n.per-session-materials{margin-top:14px}.per-material-button{display:inline-flex;align-items:center;padding:9px 14px;border-radius:9px;background:#078fbd;color:#fff!important;font-size:12px;font-weight:800;text-decoration:none!important}.per-material-button:hover{opacity:.88}\n</style>'''
          if 'id="first-session-ppt-style"' not in html:
              html=html.replace('</head>',button_css+'\n</head>',1)
          path.write_text(html,encoding='utf-8')
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add guia_profesorado_tecnologia_informatica.html
          git rm .github/workflows/fix-final-layout.yml
          git commit -m "Fix roadmap layout and link first-session PPT"
          git push
