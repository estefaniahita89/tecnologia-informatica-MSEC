name: Restore guide correctly
on:
  push:
    paths:
      - '.github/workflows/fix-guide-layout.yml'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore good guide
        run: |
          git show HEAD~7:guia_profesorado_tecnologia_informatica.html > guia_profesorado_tecnologia_informatica.html
          test -s guia_profesorado_tecnologia_informatica.html
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add guia_profesorado_tecnologia_informatica.html
          git rm .github/workflows/fix-guide-layout.yml
          git commit -m "Restore guide correctly"
          git push
