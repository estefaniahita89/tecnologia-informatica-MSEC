name: Export guide
on:
  push:
    paths:
      - '.github/workflows/export-guide.yml'
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: current-guide
          path: guia_profesorado_tecnologia_informatica.html
      - name: Remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/export-guide.yml
          git commit -m "Remove temporary export workflow"
          git push
